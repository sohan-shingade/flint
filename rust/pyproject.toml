[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "flint-core"
version = "0.1.0"
description = "High-performance backtesting engine for Flint (Rust + PyO3)"
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "flint_core"
