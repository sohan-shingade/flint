services:
  flint:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - flint-data:/app/data
      - ./strategies:/app/strategies
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  flint-data:
