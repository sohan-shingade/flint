name: Live-Venue Smoke

# Phase 5 T5.6 — manual-trigger only. Never runs on push.
#
# Places + cancels a $0.01 SOL-PERP limit order on Hyperliquid testnet.
# Proves the live code paths actually work end-to-end before Phase 6
# ships UI-driven deployment. (Drift dropped post-hack — no longer smoke-tested.)
#
# Guard rails in tests/integration/test_live_smoke.py:
#   - max notional 0.01 SOL
#   - refuse to run if wallet balance > $20
#   - testnet only (mainnet env vars ignored)
#   - auto-cancel after 10s

on:
  workflow_dispatch:
    inputs:
      venue:
        description: "Which venue to smoke test"
        type: choice
        options: [hyperliquid]
        default: hyperliquid

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Env secrets must be configured in repo settings:
    #   HL_TESTNET_KEY        — Hyperliquid API wallet private key
    env:
      FLINT_LIVE_SMOKE: "1"
      HL_TESTNET_KEY: ${{ secrets.HL_TESTNET_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,hyperliquid]" solders

      - name: Smoke test — Hyperliquid testnet
        run: |
          pytest tests/integration/test_live_smoke.py::TestHyperliquidTestnetSmoke -v
