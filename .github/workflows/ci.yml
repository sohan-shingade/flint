name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── T5.1 — Python test matrix (OS × version) ────────────────────────────
  test:
    name: tests (${{ matrix.os }} · py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Phase 5 T5.1 — no silent `|| pip install -e .` fallback; install
        # failure now fails the build instead of hiding the cause.
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,hyperliquid]" solders pytest-timeout

      - name: Run tests (with hard timeout)
        # T5.1 — pytest-timeout catches polling-loop tests that would otherwise
        # hang CI. jupiter_integration excluded (pre-existing failure tracked
        # in DEFERRED).
        run: |
          pytest tests/ \
            --ignore=tests/test_jupiter_integration.py \
            --timeout=60 \
            --tb=short -v

  # ─── T5.2 — Rust engine build + cargo tests + PyO3 parity ────────────────
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install maturin + dev deps
        run: |
          pip install --upgrade pip
          pip install maturin pytest-timeout
          pip install -e ".[dev]"

      - name: cargo test (release)
        working-directory: rust
        run: cargo test --release

      - name: maturin develop
        working-directory: rust
        run: maturin develop --release

      - name: Rust/Python parity + determinism + Rust capabilities
        # T5.2 — actual parity tests, no silent skip.
        run: |
          pytest \
            tests/test_rust_python_parity.py \
            tests/test_rust_engine.py \
            tests/test_rust_capabilities.py \
            tests/test_determinism.py \
            tests/test_fee_model_parity.py \
            --timeout=60 -v

  # ─── T5.4 — Sandbox escape suite (gated on Py test job for matrix parity) ─
  sandbox:
    name: sandbox escape (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" pytest-timeout

      - name: Run sandbox escape suite
        # Memory-bomb test skips on macOS (RLIMIT_AS is advisory); Linux
        # enforces it. 12 AST whitelist attempts + timeout + memory bomb.
        run: pytest tests/test_sandbox_escape.py --timeout=120 -v

  # ─── T5.5 — README counts anti-drift ─────────────────────────────────────
  counts:
    name: readme counts fresh
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check counts are up to date
        run: python scripts/update_readme_counts.py --check

  # ─── T5.1 — Ruff + formatting check ──────────────────────────────────────
  lint:
    name: lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        # Soft failure: ruff runs but does not block yet. Tightens to hard
        # failure once the codebase is cleaned up under D-5.1-ruff-fixes.
        run: ruff check flint/ tests/ scripts/ || echo "ruff check reported issues (non-blocking)"

      - name: Ruff format check
        run: ruff format --check flint/ tests/ scripts/ || echo "ruff format drift (non-blocking)"

      - name: Import sanity
        # Regression guard from the old lint job — catches import-cycle and
        # missing-module errors fast.
        run: |
          python -c "import flint; print('flint imported OK')"
          python -c "from flint.strategy.loader import load_user_strategy; print('Loader OK')"
          python -c "from flint.execution import FillPipeline; print('FillPipeline OK')"
          python -c "from flint.backtest.rust_capabilities import rust_capabilities; print('rust caps:', rust_capabilities()['engine'])"

  # ─── UI build ─────────────────────────────────────────────────────────────
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npx vite build
