name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,hyperliquid]" 2>/dev/null || pip install -e ".[dev]" 2>/dev/null || pip install -e .

      - name: Run tests
        run: pytest tests/ -v --tb=short

  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npx vite build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .

      - name: Check imports
        run: python -c "import flint; print(f'flint imported OK')"

      - name: Check strategy loader
        run: python -c "from flint.strategy.loader import load_user_strategy; print('Loader OK')"

      - name: Check fill pipeline
        run: python -c "from flint.execution import FillPipeline, ImpactStage, LatencyStage, PartialFillStage; print('Fill pipeline OK')"
