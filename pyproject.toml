[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flint-trading"
version = "1.0.0"
description = "Backtest and paper trade Solana perp strategies. Local-first, free data."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Sohan Shingade"}]
keywords = ["trading", "backtesting", "solana", "drift", "hyperliquid", "defi", "perps", "quantitative-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "duckdb>=0.9",
    "httpx>=0.25",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "optuna>=3.0",
    "pyarrow>=14.0",
    "websockets>=12.0",
    "typer[all]>=0.9",
    "rich>=13.0",
    "ccxt>=4.0",
]

[project.urls]
Homepage = "https://github.com/sohan-shingade/flint"
Repository = "https://github.com/sohan-shingade/flint"
Documentation = "https://github.com/sohan-shingade/flint/tree/main/docs"
"Issue Tracker" = "https://github.com/sohan-shingade/flint/issues"

[project.scripts]
flint = "flint.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
hyperliquid = ["eth-account>=0.10", "msgpack>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
all = [
    "mcp>=1.0",
    "ccxt>=4.0",
]

[tool.setuptools.packages.find]
include = ["flint*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
