[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flint-trading"
version = "1.4.1"
description = "Backtest and trade on Drift and Hyperliquid. Data from 100+ CEXs via CCXT. Local-first, free data."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Sohan Shingade"}]
keywords = ["trading", "backtesting", "solana", "drift", "hyperliquid", "defi", "perps", "quantitative-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "duckdb>=0.9",
    "httpx>=0.25",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "optuna>=3.0",
    "pyarrow>=14.0",
    "websockets>=12.0",
    "typer[all]>=0.9",
    "rich>=13.0",
    "ccxt>=4.0",
]

[project.urls]
Homepage = "https://github.com/sohan-shingade/flint"
Repository = "https://github.com/sohan-shingade/flint"
Documentation = "https://github.com/sohan-shingade/flint/tree/main/docs"
"Issue Tracker" = "https://github.com/sohan-shingade/flint/issues"

[project.scripts]
flint = "flint.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
hyperliquid = ["eth-account>=0.10", "msgpack>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
all = [
    "mcp>=1.0",
    "ccxt>=4.0",
]

[tool.setuptools.packages.find]
include = ["flint*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


# ─── Ruff — D-5.1 hard-fail focused subset ──────────────────────────────────
# Phase 5 (Wave 1) flips CI to hard-fail on real-bug rules. Style-only nits
# (line length, multi-statement lines, ambiguous single-letter variables,
# import-not-at-top because of PIT_METADATA blocks) stay allowed for now —
# they can tighten when an editorial sweep happens (D-5.1-extra sibling).
[tool.ruff.lint]
select = [
    "F401",  # unused-import
    "F811",  # redefined-while-unused
    "F821",  # undefined-name (genuine bugs)
    "F841",  # unused-variable
]
ignore = [
    "E402",  # module-level imports not at top of file (PIT_METADATA pattern)
    "E501",  # line too long
    "E702",  # multiple-statements-on-one-line-semicolon
    "E701",  # multiple-statements-on-one-line-colon
    "E741",  # ambiguous-variable-name
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
