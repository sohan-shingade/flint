[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flint"
version = "2.0.0.dev0"
description = "Local-first backtesting, paper, and live lab for perp/DEX strategies. Hyperliquid-native; ports-and-adapters core, honest fills, event-sourced runs."
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Sohan Shingade"}]
keywords = ["trading", "backtesting", "perpetuals", "hyperliquid", "solana", "dex", "defi", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "duckdb>=0.9",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "httpx>=0.25",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/sohan-shingade/flint"
Repository = "https://github.com/sohan-shingade/flint"
Documentation = "https://github.com/sohan-shingade/flint/tree/main/docs"
"Issue Tracker" = "https://github.com/sohan-shingade/flint/issues"

[project.scripts]
flint = "flint.sdk.cli:main"

[project.optional-dependencies]
research = ["optuna>=3.0"]
venues = ["ccxt>=4.0"]
mcp = ["mcp>=1.0"]
hyperliquid = ["eth-account>=0.10", "msgpack>=1.0"]
# The Nautilus tick-engine core (D29). Exact-pinned — Nautilus is pre-1.x and its
# mark/funding data types churn between minors, so the version is asserted at
# import by flint/engine/nautilus/_compat.py and stamped into every run manifest.
# No companion constraints are listed: against this repo's venv the 1.230.0 wheel's
# own metadata resolves cleanly (it pulls pandas 3 / msgspec / fsspec / portion /
# pytz / tqdm as *new* deps and moves nothing already installed). Opt-in only —
# candle-only users never pay the 156 MB wheel / ~5 s import (loaded lazily in
# flint/engine/select.py).
nautilus = ["nautilus_trader==1.230.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["flint*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "parity: legacy-vs-Nautilus byte-diff parity suite (tests/parity/, §19.4, CI-required from N6)",
]

# ─── Ruff — real-bug subset (hard-fail); style nits stay advisory ────────────
[tool.ruff.lint]
select = [
    "F401",  # unused-import
    "F811",  # redefined-while-unused
    "F821",  # undefined-name
    "F841",  # unused-variable
]
ignore = [
    "E402",  # module-level imports not at top of file
    "E501",  # line too long
    "E701",  # multiple-statements-on-one-line-colon
    "E702",  # multiple-statements-on-one-line-semicolon
    "E741",  # ambiguous-variable-name
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
