[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flint"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.9",
    "httpx>=0.25",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "optuna>=3.0",
    "pyarrow>=14.0",
    "websockets>=12.0",
    "typer[all]>=0.9",
    "rich>=13.0",
]

[project.scripts]
flint = "flint.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
ccxt = ["ccxt>=4.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
all = [
    "mcp>=1.0",
    "ccxt>=4.0",
]

[tool.setuptools.packages.find]
include = ["flint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
